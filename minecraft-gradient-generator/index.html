<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate Minecraft hex color gradient text with multiple color stops, RGB/HSL/OKLab interpolation, and text formatting — MiniMessage, legacy § / &amp; and raw JSON formats. Runs entirely in your browser.">
    <link rel="canonical" href="https://shadetools.maximanu.de/minecraft-gradient-generator/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ShadeTools">
    <meta property="og:title" content="Minecraft Gradient Generator — ShadeTools">
    <meta property="og:description" content="Generate Minecraft hex color gradient text with multiple color stops, multiple interpolation modes, and text formatting.">
    <meta property="og:url" content="https://shadetools.maximanu.de/minecraft-gradient-generator/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Minecraft Gradient Generator — ShadeTools">
    <meta name="twitter:description" content="Generate Minecraft hex color gradient text with multiple color stops and text formatting.">
    <meta name="theme-color" content="#f1f2f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)">
    <title>Minecraft Gradient Generator — ShadeTools</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="mask-icon" href="/favicon.svg" color="#6339d9">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="css/tool.css">
</head>
<body>
    <div id="header"></div>
    <main>
        <section class="st-tool-section">
            <div class="container">
                <div class="st-tool-intro">
                    <p class="st-eyebrow"><i class="bi bi-palette2"></i> Local &amp; instant</p>
                    <h1 class="st-title">Minecraft Gradient Generator</h1>
                    <p class="st-subtitle">Turn text into a hex color gradient with as many color stops as you like, three interpolation modes, and text formatting — for MOTDs, tab lists, scoreboards, and plugin messages. Nothing is sent to a server.</p>
                </div>

                <div class="st-panel">
                    <div class="st-field">
                        <div class="st-field-label">
                            <label for="input-text">Your text</label>
                        </div>
                        <input type="text" class="form-control st-input" id="input-text" placeholder="Type something…" maxlength="200" value="ShadeTools">
                    </div>

                    <div class="st-field">
                        <div class="st-field-label">
                            <label>Colors</label>
                            <button type="button" class="st-btn-text" id="add-color">+ Add color</button>
                        </div>
                        <div class="st-color-list" id="color-list"></div>
                    </div>

                    <div class="st-field">
                        <div class="st-field-label">
                            <label for="mode-select">Gradient mode</label>
                        </div>
                        <select class="form-select st-select st-select-wide" id="mode-select">
                            <option value="rgb">RGB — linear</option>
                            <option value="hsl">HSL — vivid hues</option>
                            <option value="oklab" selected>OKLab — perceptually smooth</option>
                        </select>
                    </div>

                    <div class="st-field">
                        <div class="st-field-label">
                            <label>Formatting</label>
                        </div>
                        <div class="st-toggle-grid">
                            <label class="st-toggle">
                                <input type="checkbox" id="fmt-bold">
                                <span>Bold</span>
                            </label>
                            <label class="st-toggle">
                                <input type="checkbox" id="fmt-italic">
                                <span>Italic</span>
                            </label>
                            <label class="st-toggle">
                                <input type="checkbox" id="fmt-underline">
                                <span>Underline</span>
                            </label>
                            <label class="st-toggle">
                                <input type="checkbox" id="fmt-strikethrough">
                                <span>Strikethrough</span>
                            </label>
                            <label class="st-toggle">
                                <input type="checkbox" id="fmt-obfuscate">
                                <span>Obfuscated</span>
                            </label>
                        </div>
                    </div>

                    <div class="st-gradient-preview" id="preview" aria-live="polite"></div>

                    <div class="st-field">
                        <div class="st-field-label">
                            <label for="format-select">Output format</label>
                        </div>
                        <select class="form-select st-select st-select-wide" id="format-select">
                            <option value="minimessage" selected>MiniMessage (Paper / Adventure)</option>
                            <option value="section">Legacy — § section sign</option>
                            <option value="amp">Legacy — &amp; ampersand</option>
                            <option value="json">Raw JSON (text component)</option>
                        </select>
                    </div>

                    <div class="st-output-row">
                        <div class="st-output st-output-multiline" id="output" role="textbox" aria-readonly="true" aria-label="Formatted gradient code">
                            <span class="st-output-placeholder" id="output-placeholder">Type something to generate the code</span>
                            <span class="st-output-chars" id="output-chars" aria-hidden="true"></span>
                        </div>
                        <div class="st-output-actions">
                            <button type="button" class="btn st-btn-icon" id="copy-btn" title="Copy to clipboard" aria-label="Copy to clipboard">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </div>
                    </div>

                    <p class="st-note" id="format-note"></p>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="js/generator.js"></script>
</body>
</html>
